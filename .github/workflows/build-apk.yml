name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Sync Capacitor Project
        # IMPORTANTE: Esto debe ir ANTES de los iconos para que exista la carpeta "android"
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate App Icons
        # Preparamos la carpeta que exige Capacitor y generamos los recursos de Android
        run: |
          mkdir -p assets
          if [ -f "icon.png" ]; then
            echo "Copiando icon.png a la carpeta assets..."
            cp icon.png assets/icon.png
            npx @capacitor/assets generate --android
          else
            echo "ATENCIÓN: No se encontró icon.png en la raíz del repositorio."
          fi

      - name: Make Gradle Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOOM-Mobile-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
