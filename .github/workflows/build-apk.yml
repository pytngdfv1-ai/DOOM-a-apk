name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Generar proyecto Android completo (gradlew incluido)
        run: npx cap add android

      - name: Aplicar personalizaciones nativas (fullscreen, landscape, tema)
        run: |
          mkdir -p android/app/src/main/java/com/tuempresa/doomweb
          cp native-patches/MainActivity.java android/app/src/main/java/com/tuempresa/doomweb/MainActivity.java
          cp native-patches/styles.xml android/app/src/main/res/values/styles.xml
          cp native-patches/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: doom-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
